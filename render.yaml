services:
  - type: web
    name: sendpilot-worker
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - worker/**
        - scripts/linkedin-worker.ts
        - src/lib/**
        - Dockerfile
        - package.json
        - package-lock.json
      ignoredPaths:
        - app/**
        - src/app/**
        - public/**
        - "**/*.md"

    envVars:
      - key: PORT
        value: "10000"

      - key: LINKEDIN_WORKER_SECRET
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: ENCRYPTION_KEY
        sync: false

      - key: MAX_CONCURRENCY
        value: "1"

      - key: HEADLESS
        value: "true"

      - key: AUTO_TUNNEL
        value: "false"

      - key: RENDER
        value: "true"
